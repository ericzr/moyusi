name: Deploy Moyusi preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static preview
        run: pnpm build

      - name: Add Pages fallback
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/market dist/workspace
          cp dist/index.html dist/market/index.html
          cp dist/index.html dist/workspace/index.html
          for section in overview routing sources deployments tools environment sessions usage billing settings; do
            mkdir -p "dist/workspace/$section"
            cp dist/index.html "dist/workspace/$section/index.html"
          done
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
